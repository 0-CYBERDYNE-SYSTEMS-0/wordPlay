# wordPlay — one-command team deployment.
#
#   cp .env.example .env   # set at least AUTH_PASSWORD + provider keys
#   docker compose up -d --build
#
# The app listens on 0.0.0.0:5001 inside the container; publish it on your
# LAN via the ports mapping. Schema is initialized automatically at startup.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wordplay
      POSTGRES_PASSWORD: wordplay
      POSTGRES_DB: wordplay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordplay -d wordplay"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "${PORT:-5001}:5001"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATABASE_URL: postgres://wordplay:wordplay@db:5432/wordplay
      # Provider keys (server-side only; teammates never need keys)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      MFLUX_BRIDGE_URL: ${MFLUX_BRIDGE_URL:-}
      MFLUX_STEPS: ${MFLUX_STEPS:-}
      # Custom (OpenAI-compatible) image endpoint
      IMAGE_API_URL: ${IMAGE_API_URL:-}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_API_MODEL: ${IMAGE_API_MODEL:-}
      # Team sign-in; unset AUTH_PASSWORD to run without auth
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-}
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
